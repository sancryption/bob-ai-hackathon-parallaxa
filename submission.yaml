submission:
  title: "SafetyReady"

  problem_statement: >
    Pharmaceutical teams preparing new-drug regulatory submissions face two
    time-consuming, error-prone tasks: manually scanning large adverse-event
    datasets for drug-safety signals, and auditing whether a dossier covers
    every required ICH CTD section before submission. Both tasks are typically
    done with spreadsheets and tribal knowledge, leading to missed signals and
    late-stage regulatory rejections.

  solution_summary: >
    SafetyReady is a full-stack pharmacovigilance and submission-readiness
    platform. Analysts upload a FAERS-style adverse-event CSV/JSON and the
    system runs a deterministic PRR (Proportional Reporting Ratio) pipeline
    that computes 2x2 contingency tables, applies configurable thresholds, and
    returns a ranked, severity-labelled signal list with 95% confidence
    intervals. A second workflow accepts a structured dossier outline, maps it
    against a versioned ICH CTD requirements catalog via a 4-tier matching
    algorithm (exact code, normalised code, keyword, and rapidfuzz fuzzy
    matching), scores each CTD module, and generates a prioritised gap list
    with recommendations — all without an internet connection or API key.

  key_features:
    - "PRR signal detection engine: full 2x2 contingency tables, Evans 95% CI, configurable thresholds, severity ranking (low/medium/high/critical)"
    - "MedDRA-aligned adverse-event normalisation: alias dictionary + rapidfuzz fuzzy clustering, with provenance tracking per term"
    - "ICH CTD submission readiness assessment: 4-tier matching, per-module weighted scoring, gap generation with severity and recommendations"
    - "Background job runner with live polling: upload -> queued -> running -> complete/failed lifecycle, no page reload required"
    - "Export in JSON and CSV for both workflows; structured error envelopes; 304 backend tests + 51 frontend tests"

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React 19", "Vite", "SQLModel", "Pydantic", "Vitest"]
    ibm_technologies: ["IBM Bob"]
    databases: ["SQLite (via SQLAlchemy 2 / SQLModel)"]
    other: ["rapidfuzz", "uvicorn", "GitHub Actions"]

  what_we_are_most_proud_of: >
    The two fully implemented analysis engines. The PRR signal engine is a
    complete, standards-based pharmacovigilance algorithm — not a mock — with
    case-version deduplication, MedDRA alias clustering, Evans confidence
    intervals, and configurable thresholds, validated by 304 tests against
    known fixture data. The CTD readiness engine implements a 4-tier matching
    strategy (exact, normalised, keyword, fuzzy) against a versioned catalog
    covering all five ICH modules, produces per-module weighted scores, and
    generates actionable gap recommendations. Both engines are deterministic,
    fully offline, and run with zero external API dependencies.

  known_limitations: >
    The CTD requirements catalog is a representative 20-entry prototype covering
    all five ICH modules; it is not a complete jurisdiction-specific checklist.
    Text and PDF dossier parsing is a stub — only JSON and CSV dossier outlines
    are processed. There is no authentication layer (prototype use only). The
    SQLite database is single-file and not suitable for concurrent multi-user
    deployments. The in-process FastAPI BackgroundTasks runner is not
    production-grade (no Celery/Redis). The drug alias dictionary is seeded with
    representative entries and would need extension for real-world use.

